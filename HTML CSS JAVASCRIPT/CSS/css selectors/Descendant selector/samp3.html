<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .blog-post p {
            color: blue;
        }
        .highlight-box p {
            color: red;
        }
        p{
            font-size: 20px;
            color:green
        }
        .blog-post h2 {
            text-decoration: underline;
        }
    </style>
</head>
<body>
  <div class="blog-post">
    <h2>My Travel Story</h2>
    <p>This is my first paragraph</p>
    <div class="highlight-box">
      <p>This is an fun fact inside a box</p>
</div>
  </div>
  <p>I am a paragraph outside the blog post.</p>  
</body>
</html>
