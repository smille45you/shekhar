<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
    <link rel="stylesheet" href="projects descendant.css">
    <style>
        /* Make nav list display in one line and center it */
        header nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        header nav li { margin: 0; }
        header nav a {
            display: block;
            padding: 0.4rem 0.6rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
    <header>
        <h1>Porsche</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="intro">
            <p>Welcome to our website!</p>
            <span>Enjoy your stay.</span>
        </section>

        <section class="features">
            <div class="feature-box">
                <h2>Feature 1</h2>
                <p>Feature description here.</p>
            </div>
            <div class="feature-box">
                <h2>Feature 2</h2>
                <p>Another feature description.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 My Website</p>
    </footer>
</div>

</body>
</html>
